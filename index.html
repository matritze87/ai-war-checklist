<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>AI WAR 촬영 체크리스트</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#f7f7f8; --card:#ffffff; --ink:#111827; --muted:#6b7280;
      --line:#e5e7eb; --accent:#111827; --shadow:0 8px 24px rgba(17,24,39,.07);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
    button,input,textarea{font:inherit}
    .wrap{max-width:960px;margin:0 auto;padding:18px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;position:sticky;top:0;background:rgba(247,247,248,.94);backdrop-filter:blur(10px);z-index:10;padding:10px 0}
    h1{font-size:24px;margin:0}
    .sub{color:var(--muted);font-size:13px;margin-top:4px}
    .btn{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:12px;cursor:pointer}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.ghost{background:transparent}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
    .country-card{cursor:pointer}
    .country-name{font-size:22px;font-weight:800}
    .country-sub{font-size:13px;color:var(--muted);margin-top:5px}
    .hidden{display:none!important}
    .back{border:none;background:none;padding:0;color:#374151;cursor:pointer;font-weight:700;margin-bottom:10px}
    .country-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
    .country-head h2{font-size:28px;margin:0}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .item-main{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px;cursor:pointer}
    .item-main:hover{background:#fafafa}
    .item input[type=checkbox]{width:21px;height:21px}
    .item-title{font-weight:700;line-height:1.35}
    .chev{font-size:18px;color:#9ca3af}
    .item.open .chev{transform:rotate(90deg)}
    .note-panel{display:none;border-top:1px solid var(--line);padding:12px 14px 14px}
    .item.open .note-panel{display:block}
    .note-panel textarea{width:100%;min-height:95px;border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;background:#fff}
    .note-actions{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
    .danger{color:#b91c1c}
    .add-row{display:flex;gap:8px;margin-top:14px}
    .add-row input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}
    .empty{padding:24px;text-align:center;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:99;padding:12px}
    .sheet{background:#fff;width:min(620px,100%);border-radius:20px 20px 12px 12px;padding:18px}
    .field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
    .field label{font-size:13px;color:var(--muted)}
    .field input{border:1px solid var(--line);border-radius:10px;padding:10px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    @media(max-width:700px){
      .wrap{padding:12px}
      h1{font-size:20px}
      .country-head h2{font-size:26px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AI WAR 촬영 체크리스트</h1>
      <div class="sub">나라별로 필요한 것만 빠르게 체크</div>
    </div>
    <button class="btn primary" id="addCountryBtn">+ 국가 추가</button>
  </header>

  <main id="homeView">
    <div class="grid" id="countryGrid"></div>
  </main>

  <main id="countryView" class="hidden">
    <button class="back" id="backBtn">← 전체 국가</button>
    <div class="country-head">
      <div>
        <h2 id="countryName"></h2>
        <div class="sub">항목을 눌러 메모를 남길 수 있어요.</div>
      </div>
      <button class="btn" id="editCountryBtn">국가 수정</button>
    </div>

    <div id="taskList" class="list"></div>

    <div class="add-row">
      <input id="newTaskInput" placeholder="새 체크항목 입력" />
      <button class="btn primary" id="addTaskBtn">추가</button>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <h3 id="modalTitle" style="margin:0">국가 추가</h3>
    <div class="field">
      <label>국가명</label>
      <input id="countryNameInput" />
    </div>
    <div class="field">
      <label>이모지</label>
      <input id="countryFlagInput" placeholder="🇹🇼" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="closeModalBtn">취소</button>
      <button class="btn primary" id="saveCountryBtn">저장</button>
    </div>
  </div>
</div>

<script>
const seed = {
  countries:[
    {
      id:"tw", name:"대만", flag:"🇹🇼",
      tasks:[
        {id:crypto.randomUUID(), title:"스친타이 교수 인터뷰 준비", done:false, note:""},
        {id:crypto.randomUUID(), title:"차오싱청 섭외 진행", done:false, note:""},
        {id:crypto.randomUUID(), title:"Joseph Wu 일정 확인", done:false, note:""},
        {id:crypto.randomUUID(), title:"ASE 촬영 협조 요청", done:false, note:""},
        {id:crypto.randomUUID(), title:"MediaTek 촬영 협조 요청", done:false, note:""},
        {id:crypto.randomUUID(), title:"신주 반도체 생태계 촬영 포인트 정리", done:false, note:""},
        {id:crypto.randomUUID(), title:"대만 통역 일정 확정", done:false, note:""},
        {id:crypto.randomUUID(), title:"촬영 허가·장비 반입 확인", done:false, note:""}
      ]
    },
    {
      id:"jp", name:"일본", flag:"🇯🇵",
      tasks:[
        {id:crypto.randomUUID(), title:"키옥시아 섭외 검토", done:false, note:""},
        {id:crypto.randomUUID(), title:"사카이 AI 데이터센터 촬영 가능 여부 확인", done:false, note:""},
        {id:crypto.randomUUID(), title:"피지컬 AI 촬영 후보 정리", done:false, note:""},
        {id:crypto.randomUUID(), title:"반도체 소부장 취재처 확정", done:false, note:""}
      ]
    },
    {
      id:"in", name:"인도", flag:"🇮🇳",
      tasks:[
        {id:crypto.randomUUID(), title:"Objectways 답변 확인", done:false, note:""},
        {id:crypto.randomUUID(), title:"Labellerr 답변 확인", done:false, note:""},
        {id:crypto.randomUUID(), title:"데이터 라벨링 현장 촬영 가능 여부 확인", done:false, note:""}
      ]
    },
    {
      id:"ae", name:"UAE", flag:"🇦🇪",
      tasks:[
        {id:crypto.randomUUID(), title:"G42 섭외", done:false, note:""},
        {id:crypto.randomUUID(), title:"AI 인프라 / 데이터센터 촬영처 확정", done:false, note:""}
      ]
    },
    {
      id:"kr", name:"한국", flag:"🇰🇷",
      tasks:[
        {id:crypto.randomUUID(), title:"HD현대삼호 촬영 협의", done:false, note:""},
        {id:crypto.randomUUID(), title:"현대로보틱스 / 현대차 촬영 협의", done:false, note:""},
        {id:crypto.randomUUID(), title:"조선소 피지컬 AI 촬영 포인트 정리", done:false, note:""}
      ]
    }
  ]
};

const KEY="aiwar_checklist_v2";
let data=JSON.parse(localStorage.getItem(KEY)||"null") || seed;
let currentCountryId=null;
let editingCountryId=null;

const qs=s=>document.querySelector(s);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const el=(tag,cls="",txt="")=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e;}

function renderHome(){
  qs("#homeView").classList.remove("hidden");
  qs("#countryView").classList.add("hidden");
  const grid=qs("#countryGrid"); grid.innerHTML="";
  data.countries.forEach(c=>{
    const card=el("div","card country-card");
    card.innerHTML=`<div class="country-name">${c.flag} ${c.name}</div><div class="country-sub">${c.tasks.length}개 체크항목</div>`;
    card.onclick=()=>openCountry(c.id);
    grid.append(card);
  });
}

function openCountry(id){
  currentCountryId=id;
  const c=data.countries.find(x=>x.id===id);
  qs("#homeView").classList.add("hidden");
  qs("#countryView").classList.remove("hidden");
  qs("#countryName").textContent=`${c.flag} ${c.name}`;
  qs("#newTaskInput").value="";
  renderTasks();
}

function renderTasks(){
  const c=data.countries.find(x=>x.id===currentCountryId);
  const box=qs("#taskList"); box.innerHTML="";
  if(!c.tasks.length){
    box.append(el("div","card empty","아직 체크항목이 없습니다."));
    return;
  }
  c.tasks.forEach(t=>{
    const item=el("div","item");
    const main=el("div","item-main");
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=t.done;
    cb.onclick=e=>e.stopPropagation();
    cb.onchange=()=>{t.done=cb.checked;save();};
    const title=el("div","item-title",t.title);
    if(t.done) title.style.textDecoration="line-through";
    const chev=el("div","chev","›");
    main.append(cb,title,chev);

    const panel=el("div","note-panel");
    const ta=document.createElement("textarea");
    ta.placeholder="메모를 입력하세요";
    ta.value=t.note||"";
    ta.onclick=e=>e.stopPropagation();
    ta.oninput=()=>{t.note=ta.value;save();};

    const actions=el("div","note-actions");
    const renameBtn=el("button","btn","항목명 수정");
    const delBtn=el("button","btn danger","삭제");
    renameBtn.onclick=e=>{
      e.stopPropagation();
      const nv=prompt("항목명을 수정하세요",t.title);
      if(nv && nv.trim()){t.title=nv.trim();save();renderTasks();}
    };
    delBtn.onclick=e=>{
      e.stopPropagation();
      if(confirm("이 체크항목을 삭제할까요?")){
        c.tasks=c.tasks.filter(x=>x.id!==t.id);save();renderTasks();
      }
    };
    actions.append(renameBtn,delBtn);
    panel.append(ta,actions);

    main.onclick=()=>item.classList.toggle("open");
    item.append(main,panel);
    box.append(item);
  });
}

function addTask(){
  const inp=qs("#newTaskInput");
  const title=inp.value.trim();
  if(!title)return;
  const c=data.countries.find(x=>x.id===currentCountryId);
  c.tasks.push({id:crypto.randomUUID(),title,done:false,note:""});
  save();
  inp.value="";
  renderTasks();
}

function openCountryModal(id=null){
  editingCountryId=id;
  const isNew=!id;
  const c=isNew?{name:"",flag:"🌍"}:data.countries.find(x=>x.id===id);
  qs("#modalTitle").textContent=isNew?"국가 추가":"국가 수정";
  qs("#countryNameInput").value=c.name;
  qs("#countryFlagInput").value=c.flag;
  qs("#modal").classList.remove("hidden");
}
function closeModal(){qs("#modal").classList.add("hidden");}
function saveCountry(){
  const name=qs("#countryNameInput").value.trim();
  const flag=qs("#countryFlagInput").value.trim()||"🌍";
  if(!name)return alert("국가명을 입력해 주세요.");
  if(editingCountryId){
    const c=data.countries.find(x=>x.id===editingCountryId);
    c.name=name;c.flag=flag;
    save();closeModal();openCountry(c.id);
  }else{
    const id=crypto.randomUUID();
    data.countries.push({id,name,flag,tasks:[]});
    save();closeModal();renderHome();
  }
}

qs("#backBtn").onclick=renderHome;
qs("#addTaskBtn").onclick=addTask;
qs("#newTaskInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});
qs("#addCountryBtn").onclick=()=>openCountryModal();
qs("#editCountryBtn").onclick=()=>openCountryModal(currentCountryId);
qs("#closeModalBtn").onclick=closeModal;
qs("#saveCountryBtn").onclick=saveCountry;
qs("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
renderHome();
</script>
</body>
</html>
